name: Validate Taxonomy Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./spaceAI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Install ML dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate taxonomy schema
        run: python validate_taxonomy.py

      - name: Train classification model
        run: python run.py train

      - name: Train regression models
        run: python run.py train-regression

      - name: Run Python test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
        working-directory: .

      - name: Install npm dependencies
        run: npm ci
        working-directory: .

      - name: TypeScript check
        run: npm run check
        working-directory: .

      - name: Client test suite
        run: npm test
        working-directory: .