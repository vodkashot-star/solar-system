[project]
name = "spaceAI"
version = "0.1.0"
description = "Educational AI system for celestial classification and orbital prediction"
authors = [
    { name="JNx", email="jnalair28@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.2.2",
    "pandas>=1.3.5",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
