services:
  spaceai:
    build:
      context: ./spaceAI
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - SPACEAI_URL=http://spaceai:8000
    depends_on:
      - spaceai
    restart: unless-stopped
